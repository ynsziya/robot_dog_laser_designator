octomap_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map                 # slam_toolbox map→odom varken
    base_frame_id: base_footprint
    resolution: 0.05
    sensor_model.max_range: 20.0
    sensor_model.hit: 0.7
    sensor_model.miss: 0.4
    sensor_model.min: 0.12
    sensor_model.max: 0.97
    latch: false
    filter_ground_plane: true
    filter_speckles: true
    point_cloud_min_z: -0.5
    point_cloud_max_z: 2.0
    occupancy_min_z: -0.5
    occupancy_max_z: 2.0
    compress_map: true
    use_height_map: true
    color.r: 0.0
    color.g: 0.0
    color.b: 1.0
    color.a: 1.0