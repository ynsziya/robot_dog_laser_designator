controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_position_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters: {}

# 12 joints, order matches RobotDogModel::orderedJointNames() (fl, fr, rl, rr)
# and robot_dog_controller_node's Float64MultiArray publishing order.
leg_position_controller:
  ros__parameters:
    joints:
      - fl_hip_roll_joint
      - fl_hip_yaw_joint
      - fl_knee_joint
      - fr_hip_roll_joint
      - fr_hip_yaw_joint
      - fr_knee_joint
      - rl_hip_roll_joint
      - rl_hip_yaw_joint
      - rl_knee_joint
      - rr_hip_roll_joint
      - rr_hip_yaw_joint
      - rr_knee_joint
