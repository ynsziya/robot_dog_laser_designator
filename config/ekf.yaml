ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    two_d_mode: true          # düz zemin simülasyonu; z/roll/pitch’i sabitle
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom         # odom→base TF üretir (map→odom SLAM sonra)

    # --- Odom: konum + lineer hız ---
    odom0: /leg_odom
    odom0_config: [true,  true,  false,   # x, y, z
                   false, false, false,   # roll, pitch, yaw  (yaw IMU'dan)
                   true,  true,  false,   # vx, vy, vz
                   false, false, false,   # vroll, vpitch, vyaw
                   false, false, false]   # ax, ay, az
    odom0_differential: false
    odom0_queue_size: 10

    # --- IMU: yönelim + açısal hız ---
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,    # yaw
                  false, false, false,
                  false, false, true,    # yaw rate
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10