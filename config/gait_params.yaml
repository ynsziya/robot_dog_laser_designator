robot_dog_controller_node:
  ros__parameters:
    # --- Topics -----------------------------------------------------------
    cmd_vel_topic: "/cmd_vel"
    imu_topic: "/imu"
    joint_commands_topic: "/leg_position_controller/commands"
    # std_msgs/String: sit | stand | wave | play_bow | beg | shake
    posture_cmd_topic: "/posture_cmd"

    # --- Control loop -------------------------------------------------------
    control_frequency_hz: 100.0
    # <= 0: latch last cmd_vel until a new message arrives (press once to
    # move; space/k in teleop_twist_keyboard sends zero to stop).
    # > 0: if no cmd_vel arrives for this long, stand still (hold-to-drive).
    cmd_vel_timeout_sec: 0.0

    # --- Teleop shaping -----------------------------------------------------
    # Below these thresholds, small joystick/teleop noise is treated as zero
    # so the robot stands rock-still instead of shuffling in place.
    linear_deadband: 0.01     # m/s
    angular_deadband: 0.02    # rad/s
    max_linear_speed: 0.4     # m/s, cmd_vel.linear.x / .y clamp
    max_angular_speed: 1.0    # rad/s, cmd_vel.angular.z clamp
    # Safety clamp on the per-leg stride computed from cmd_vel; prevents an
    # unreachable IK target if a big command is combined with a low gait
    # frequency.
    max_stride: 0.18          # m

    # --- Gait ---------------------------------------------------------------
    gait_type: "trot"         # trot | walk | pace | bound
    duty_factor: 0.5          # 0.5 = classic trot (equal swing/stance)
    # Step frequency scales linearly with commanded speed between these two
    # bounds (0 Hz while standing still, handled separately).
    min_step_frequency_hz: 0.8
    max_step_frequency_hz: 2.2

    # --- Swing trajectory shape ----------------------------------------------
    step_height: 0.06              # m, peak foot clearance during swing
    control_point_fraction: 0.2    # 0-1, smaller = punchier liftoff/touchdown

    # --- Body pose trim / IMU leveling ---------------------------------------
    # Tilt compensation is OFF by default (gains = 0) until you've verified
    # sign conventions against this robot's actual IMU orientation in sim.
    use_imu_feedback: false
    body_height_trim: 0.0          # m, +raises / -crouches the standing height
    pitch_compensation_gain: 0.0
    roll_compensation_gain: 0.0
    max_trim_z: 0.05

    # --- Sit / stand posture ---------------------------------------------
    # Fixed joint-space pose (all 4 legs identical) the robot blends into
    # when "sit" arrives on posture_cmd_topic. Deeper knee bend + more
    # hip_pitch flex than standing (0.764 / -1.646) lowers the body onto its
    # haunches. cmd_vel is ignored while sitting / mid-transition / mid-trick.
    # Tricks (wave, play_bow, beg, shake) are timed keyframe sequences in
    # TrickPlayer -- no extra params here; they auto-return to stand.
    sit_hip_roll: 0.0
    sit_hip_pitch: 1.3
    sit_knee: -2.5
    sit_transition_duration_sec: 0.5   # seconds for a full sit<->stand blend
