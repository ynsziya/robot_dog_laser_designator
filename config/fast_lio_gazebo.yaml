/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 4
    max_iteration: 4
    filter_size_surf: 0.25
    filter_size_map: 0.30
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    # Overridden at launch to <pkg>/maps/fast_lio.pcd (not the ros2_ws cwd).
    map_file_path: "fast_lio.pcd"

    common:
      lid_topic: "/fast_lio/points"
      imu_topic: "/imu_fastlio"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      # Velodyne handler reads time/ring. The bridge fills time=scan_period
      # so FAST-LIO treats the Gazebo snapshot as one instant at scan end.
      lidar_type: 2
      scan_line: 32
      scan_rate: 10
      timestamp_unit: 0
      blind: 0.5

    mapping:
      acc_cov: 2.0
      gyr_cov: 0.5
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 30.0
      extrinsic_est_en: false
      # LiDAR pose in IMU frame (URDF: both fixed to base_link, identity R).
      # T_imu_lidar = T_base_lidar - T_base_imu
      extrinsic_T: [0.276561, 0.0, 0.177000]
      extrinsic_R: [1., 0., 0.,
                    0., 1., 0.,
                    0., 0., 1.]

    publish:
      path_en: true
      effect_map_en: false
      map_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: false

    pcd_save:
      pcd_save_en: true
      interval: -1
